name: Organizar ficheiros My Net
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/organizar-projecto.yml'
permissions:
  contents: write
jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair e publicar o código
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path('My-Net-Codigo-Actualizado.zip')
          with ZipFile(archive) as z:
              for item in z.infolist():
                  p = Path(item.filename)
                  if p.is_absolute() or '..' in p.parts:
                      raise ValueError('Caminho inseguro no ZIP')
              z.extractall('.')
          archive.unlink()
          Path('My-Net-Codigo-Fonte.zip').unlink(missing_ok=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Organiza código fonte My Net em ficheiros'
            git push origin HEAD:main
          fi
